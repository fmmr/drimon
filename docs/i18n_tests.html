<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I18n Module Tests</title>
    <!-- 
        This file is used to test the new I18n system in js/core/i18n.js.
        It provides both automated tests and interactive testing tools.
        
        Key features:
        - Runs unit tests for all I18n functionality
        - Provides interactive language switching
        - Demonstrates translation key usage
        - Validates translations across languages
        
        This page is standalone and demonstrates the I18n system in action.
    -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        
        h1, h2, h3 {
            color: #333;
        }
        
        .test-summary {
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
        }
        
        .test-passed {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .test-failed {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        pre {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        
        code {
            font-family: Menlo, Monaco, 'Courier New', monospace;
        }
        
        .test-section {
            margin-bottom: 30px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        button:hover {
            background-color: #0069d9;
        }
        
        .language-selector {
            margin-bottom: 20px;
        }
        
        .translation-example {
            margin-top: 10px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>I18n Module Tests</h1>
    
    <div class="test-section">
        <h2>Automated Tests</h2>
        <button id="run-tests">Run All Tests</button>
        <div id="test-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Interactive Testing</h2>
        
        <div class="language-selector">
            <h3>Language Selector</h3>
            <button data-lang="en">English</button>
            <button data-lang="no">Norwegian</button>
            <button data-lang="es">Spanish</button>
        </div>
        
        <div>
            <h3>Translation Examples</h3>
            <div>
                <label for="key-input">Translation Key:</label>
                <input type="text" id="key-input" value="greeting">
                <button id="translate-btn">Translate</button>
            </div>
            
            <div class="translation-example" id="translation-result"></div>
            
            <h4>Elements with data attributes:</h4>
            <p data-i18n="greeting"></p>
            <p data-i18n="farewell"></p>
            <p data-i18n="nonexistent"></p>
            
            <h4>Parameter interpolation:</h4>
            <div class="translation-example" id="param-result"></div>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Validation</h2>
        <button id="validate-btn">Validate Translations</button>
        <pre id="validation-result"></pre>
    </div>
    
    <!-- Load required libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/nb.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/es.min.js"></script>
    
    <!-- Load our modules -->
    <script type="module">
        import I18n from './js/core/i18n.js';
        
        // Make I18n available globally for tests
        window.I18n = I18n;
        
        // Sample translations for testing
        const testTranslations = {
            'en': {
                'greeting': 'Hello',
                'farewell': 'Goodbye',
                'error': 'Error',
                'welcome': 'Welcome to I18n testing',
                'param_test': 'Hello, {{name}}!',
                'multi_param': 'Hello, {{name}}! You have {{count}} messages.',
                'english_only': 'English only string'
            },
            'no': {
                'greeting': 'Hei',
                'farewell': 'Farvel',
                'error': 'Feil',
                'welcome': 'Velkommen til I18n testing',
                'param_test': 'Hei, {{name}}!',
                'multi_param': 'Hei, {{name}}! Du har {{count}} meldinger.'
            },
            'es': {
                'greeting': 'Hola',
                'farewell': 'Adiós',
                'error': 'Error',
                'welcome': 'Bienvenido a las pruebas de I18n',
                'param_test': '¡Hola, {{name}}!',
                'multi_param': '¡Hola, {{name}}! Tienes {{count}} mensajes.',
                'spanish_only': 'Cadena solo en español'
            }
        };
        
        // Initialize I18n
        I18n.initialize(testTranslations, {
            defaultLanguage: 'en',
            warnOnMissing: true
        });
        
        // Set up interactive examples
        document.addEventListener('DOMContentLoaded', () => {
            // Update all i18n elements on the page
            I18n.updatePageLanguage();
            
            // Set up language selector buttons
            document.querySelectorAll('.language-selector button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const lang = btn.getAttribute('data-lang');
                    I18n.setLanguage(lang);
                    updateExamples();
                });
            });
            
            // Set up translate button
            document.getElementById('translate-btn').addEventListener('click', () => {
                const key = document.getElementById('key-input').value;
                const result = I18n.translate(key);
                document.getElementById('translation-result').textContent = `${key} -> ${result}`;
            });
            
            // Set up parameter example
            updateExamples();
            
            // Set up validation button
            document.getElementById('validate-btn').addEventListener('click', () => {
                const validation = I18n.validateTranslations();
                document.getElementById('validation-result').textContent = 
                    JSON.stringify(validation, null, 2);
            });
            
            // Set up run tests button
            document.getElementById('run-tests').addEventListener('click', () => {
                document.getElementById('test-results').innerHTML = 'Running tests...';
                // Load the test script dynamically
                const script = document.createElement('script');
                script.src = './js/tests/i18n.test.js';
                document.body.appendChild(script);
            });
        });
        
        // Update all interactive examples with current language
        function updateExamples() {
            // Update all i18n elements
            I18n.updatePageLanguage();
            
            // Update parameter example
            const paramResult = I18n.translate('param_test', { name: 'World' });
            document.getElementById('param-result').textContent = paramResult;
            
            // Update translation buttons to show current language
            const currentLang = I18n.getCurrentLanguage();
            document.querySelectorAll('.language-selector button').forEach(btn => {
                const btnLang = btn.getAttribute('data-lang');
                btn.style.fontWeight = (btnLang === currentLang) ? 'bold' : 'normal';
            });
        }
    </script>
</body>
</html>
