<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriMon — Kalender-heatmap</title>
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/locale/nb.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data-10-year-range.min.js"></script>
</head>
<body>
    <header>
        <h1>Vindusåpning · kalender-heatmap</h1>
        <div id="controls">Farge = daglig median-åpning (proxy for hvor lenge vinduet var åpent).</div>
    </header>
    <main>
        <div id="status">Laster…</div>
        <div id="calendar-wrapper" hidden>
            <h2>Vindusåpning · daglig median (mm)</h2>
            <div id="calendar-window" class="calendar"></div>
            <div id="legend-window" class="legend"></div>

            <h2>Temperatur · daglig median (°C)</h2>
            <div id="calendar-temp" class="calendar"></div>
            <div id="legend-temp" class="legend"></div>

            <h2>Lys · daglig median (lux)</h2>
            <div id="calendar-lux" class="calendar"></div>
            <div id="legend-lux" class="legend"></div>

            <h2>Vind · daglig median (m/s)</h2>
            <div id="calendar-wind" class="calendar"></div>
            <div id="legend-wind" class="legend"></div>
        </div>
        <p class="footer" data-subpage-footer></p>
    </main>
    <script src="js/subpage-footer.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
