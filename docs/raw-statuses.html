<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriMon — Rå statuser</title>
    <link rel="stylesheet" href="css/status.css">
    <link rel="stylesheet" href="css/raw-statuses.css">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/locale/nb.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data-10-year-range.min.js"></script>
</head>
<body>
    <header>
        <h1>Rå statuser</h1>
        <div id="controls"></div>
    </header>
    <main>
        <div id="loading">Laster…</div>

        <section id="table-section" hidden>
            <p class="hint">Klikk på en rad for å kopiere status-strengen til utklippstavlen.</p>
            <table id="raw-table">
                <thead>
                    <tr>
                        <th>Tid (Oslo)</th>
                        <th title="Kanaler 1=Drimon, 2=Detaljer, 3=Tech — grønn = status observert på denne kanalen, · = kanalen mangler dette wake">Kanaler</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <p class="footer" data-subpage-footer></p>
    </main>
    <script src="js/subpage-footer.js"></script>
    <script src="js/raw-statuses.js"></script>
</body>
</html>
